# Self-contained dev/test overlay: in-cluster MinIO stands in for S3.
# One command gives you the full serverless topology on any cluster
# (kind/k3s/minikube included):
#   kubectl apply -k deploy/kubernetes/overlays/minio-dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: compass-dev
resources:
  - namespace.yaml
  - minio.yaml
  - ../../base
  - ../../components/cold

images:
  - name: compass
    # Pulls the published image so `kubectl apply -k <github url>` works on
    # any cluster with no clone. For offline dev, import your own build under
    # this exact name (docker save | ctr -n k8s.io images import / kind load).
    newName: ghcr.io/runcaptain/compass
    newTag: latest

secretGenerator:
  - name: compass-aws
    literals:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    options:
      disableNameSuffixHash: true

patches:
  # IfNotPresent: pulls ghcr on a fresh cluster, but prefers a locally
  # imported image of the same name (offline dev), instead of :latest's
  # default Always which would re-pull over it.
  - target:
      kind: StatefulSet
      name: compass-serving
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: compass-writer
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: compass-cold
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: compass-config
      data:
        COMPASS_STORAGE: "s3://compass-data"
        COMPASS_S3_ENDPOINT: "http://minio:9000"
        COMPASS_S3_ALLOW_HTTP: "true"
        AWS_REGION: "us-east-1"
