# Local S3-native test stack: Compass (object-storage mode) + MinIO.
#
# MinIO is S3-compatible, so this exercises the EXACT object_store S3 code path
# that a real bucket (AWS S3 / R2 / etc.) would — with no cloud credentials and
# no spend. Use it to watch Compass write WAL fragments + a manifest to object
# storage as you ingest.
#
#   docker compose -f docker-compose.minio.yml up --build
#
# Then (in another terminal):
#   # create a collection
#   curl -s localhost:4001/collections -H 'content-type: application/json' \
#     -d '{"name":"demo","embedding_dims":4}'
#   # ingest a couple of chunks (with precomputed 4-dim vectors)
#   curl -s localhost:4001/collections/demo/ingest -H 'content-type: application/json' \
#     -d '{"chunks":[{"file_id":"f1","chunk_index":0,"text":"hello",
#          "embeddings":{"default":[0.1,0.2,0.3,0.4]}}]}'
#
# Watch the objects appear in MinIO:
#   - Console UI:  http://localhost:9001  (login: minioadmin / minioadmin)
#   - or CLI:      docker compose -f docker-compose.minio.yml exec minio \
#                    mc ls -r local/compass-data/
#   You should see:  demo/manifest  and  demo/wal/00000000000000000000.frag

services:
  minio:
    image: minio/minio:latest
    container_name: compass-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the bucket Compass will use.
  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/compass-data &&
      echo 'bucket compass-data ready'
      "

  compass:
    build:
      context: .
      dockerfile: Dockerfile
      # Build WITH the object-storage feature so the S3 backend is compiled in.
      args:
        CARGO_FEATURES: object-storage
    container_name: compass-objstore
    depends_on:
      createbucket:
        condition: service_completed_successfully
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      DATA_DIR: /app/data
      RUST_LOG: compass=info
      # ── Object-storage mode, pointed at MinIO ──────────────────────────────
      COMPASS_STORAGE: s3://compass-data
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      COMPASS_S3_ENDPOINT: http://minio:9000
      COMPASS_S3_ALLOW_HTTP: "true"
    volumes:
      - compass_objstore_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  minio_data:
  compass_objstore_data:
