name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

# Creating a release needs contents:write; the default token is read-only.
permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify tag matches Cargo.toml
        run: |
          # The version lives in [workspace.package] in the ROOT manifest;
          # crate manifests say `version.workspace = true`.
          CARGO_VERSION=$(grep "^version" Cargo.toml | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          if [ "${{ steps.version.outputs.version }}" != "$CARGO_VERSION" ]; then
            echo "Tag version ${{ steps.version.outputs.version }} does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Build release binaries
        run: cargo build --release -p compass

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Release body = this version's CHANGELOG section, verbatim.
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$ d' > /tmp/notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION already exists — skipping creation"
          else
            gh release create "v$VERSION" \
              --title "Release v$VERSION" \
              --notes-file /tmp/notes.md
          fi

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests before publish
        run: cargo test --workspace --exclude compass-vector-gpu

      - name: Publish compass-index-api
        run: cargo publish -p compass-index-api --token ${{ secrets.CARGO_TOKEN }}

      - name: Publish compass
        run: cargo publish -p compass --token ${{ secrets.CARGO_TOKEN }}
        
      - name: Wait for crates.io to index
        run: sleep 30
