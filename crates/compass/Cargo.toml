[package]
name = "compass"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Embedded vector + full-text search engine. Single binary, zero external dependencies."

[[bin]]
name = "compass"
path = "src/main.rs"

[features]
default = []
# Opt-in object-storage backend (S3/GCS/Azure/MinIO) via the object_store
# crate. Off by default; local-first builds skip the object_store dependency
# tree (`futures` is unconditional — the cold read path uses it).
object-storage = ["dep:object_store"]

[dependencies]
# Internal trait crate — defines VectorIndex, IndexParams, IndexError.
# Stable surface that pluggable backends bind to.

axum = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
half = { workspace = true }
tantivy = { workspace = true }
usearch = { workspace = true }
roaring = { workspace = true }
tokenizers = { workspace = true }
safetensors = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
memmap2 = { workspace = true }
bytemuck = { workspace = true }
redb = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
lru = { workspace = true }
# Object-storage backend deps (optional, enabled by the `object-storage` feature).
object_store = { workspace = true, optional = true }
futures = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

